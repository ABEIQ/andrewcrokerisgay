
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>I'm Finally Out of the Closet!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("background.png");
            background-size: 300px auto;
            background-repeat: repeat;
        }

        .banner {
            position: fixed;

            /* Exact centre of browser */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            /* Responsive sizing */
            width: 95vw;
            max-width: 1300px;
            max-height: 95vh;
            max-height: 95dvh;
            height: auto;

            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>
    <img
        src="banner.png"
        alt="I'm Finally Out of the Closet!"
        class="banner"
    >
</body>
</html>
